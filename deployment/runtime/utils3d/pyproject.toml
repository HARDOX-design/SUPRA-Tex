[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utils3d"
version = "0.0.2"
description = "Deployment source snapshot; dependencies installed by the deployment requirements"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["utils3d*"]
namespaces = true
