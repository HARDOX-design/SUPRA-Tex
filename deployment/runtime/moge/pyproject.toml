[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moge"
version = "2.0.0"
description = "Deployment source snapshot; dependencies installed by the deployment requirements"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["moge*"]
namespaces = true
