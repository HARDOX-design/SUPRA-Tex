[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-tex"
version = "0.1.0"
description = "SUPRA-Tex: 3D Generation with Super-Aligned Texture"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6", "torchvision>=0.21", "numpy", "Pillow", "scipy",
  "easydict", "tqdm", "einops", "safetensors", "huggingface-hub",
  "trimesh", "opencv-python-headless", "imageio", "imageio-ffmpeg", "numba",
]

[project.optional-dependencies]
frontend = ["transformers==4.57.3", "diffusers==0.37.1", "accelerate", "requests", "timm"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["supratex*"]

[tool.setuptools.package-data]
"supratex.backview.harness" = ["prompts/*.txt", "README.md"]

